<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secret Chat 💬</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e5ddd5; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        h2 { color: #075e54; margin-bottom: 10px; }
        #chat-container { width: 100%; max-width: 450px; height: 80vh; background: #efeae2; display: flex; flex-direction: column; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); overflow: hidden; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

        /* Message Bubbles Styling */
        .msg-wrapper { display: flex; width: 100%; }
        .msg-wrapper.sent { justify-content: flex-end; } /* Sender -> Right */
        .msg-wrapper.received { justify-content: flex-start; } /* Receiver -> Left */

        .msg-item { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .sent .msg-item { background: #d9fdd3; color: #111b21; border-top-right-radius: 0; }
        .received .msg-item { background: #ffffff; color: #111b21; border-top-left-radius: 0; }

        .username { font-size: 11px; font-weight: bold; color: #128c7e; margin-bottom: 3px; display: block; }
        .sent .username { color: #0b8043; }

        /* Input Area */
        #input-area { display: flex; padding: 10px; background: #f0f0f0; border-top: 1px solid #ddd; }
        #message { flex: 1; padding: 10px; border: none; border-radius: 20px; outline: none; font-size: 15px; background: white; padding-left: 15px; }
        #send-btn { margin-left: 8px; padding: 10px 20px; background: #00a884; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #send-btn:hover { background: #008f72; }
    </style>
</head>
<body>

    <h2>Secret Chat 💬</h2>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="message" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const socket = io();

        // Abhi ke liye temporary ask for name jab tak proper login na bane
        let myUsername = localStorage.getItem("chat_username");
        if (!myUsername) {
            myUsername = prompt("Apna Naam Likhein:") || "Anonymous";
            localStorage.setItem("chat_username", myUsername);
        }

        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('send-btn');

        // Server se message aane par handle karein
        socket.on('message', function(data) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('msg-wrapper');

            // Check karein ki message maine bheja hai ya kisi aur ne
            if (data.sender === myUsername) {
                wrapper.classList.add('sent'); // Right Side
            } else {
                wrapper.classList.add('received'); // Left Side
            }

            wrapper.innerHTML = `
                <div class="msg-item">
                    <span class="username">${data.sender}</span>
                    <div>${data.msg}</div>
                </div>
            `;

            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll to bottom
        });

        // Message send karne par
        sendBtn.onclick = function() {
            const msgText = messageInput.value.trim();
            if (msgText !== "") {
                // Ab hum sirf text nahi, balki ek object bhej rahe hain jisme naam bhi hai
                socket.send({ msg: msgText, sender: myUsername });
                messageInput.value = "";
            }
        };

        messageInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendBtn.click();
        });
    </script>
</body>
</html>
